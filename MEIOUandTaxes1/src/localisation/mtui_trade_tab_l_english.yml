 provinceview_tab11_rank_tt: "§OTrade Rank§!: the sector's place in the order in which trade happens (1 = first). Higher ranks get the first pick of trade opportunities. It depends on the number of merchants, trade efficiency and the fleet (a trade ship counts as 2 galleys, a heavy ship as 2 trade ships)."
 provinceview_tab11_pick: "Pick a good to see this sector's trade in it."
 provinceview_tab11_help: "§OSurplus§! and §ODemand§! are net sector quantities. §OSold§! and §OBought§! at §Tcommercial§!: what the sector sold to and bought from its own §Tcommercial district§!, where the stockpiles are. Merchants may not buy all of the production (§RWasted§!) or not sell enough of their stockpile (§RUnmet§! demand). §OUnresolved§! bids found no partner: bad relations or too little production around."
 provinceview_tab11_label_1: "Surplus\nDemand\nSubsistence"
