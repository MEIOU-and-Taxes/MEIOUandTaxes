 Rights_NOGov: "§G[Rights_NOGov_t]§!"
 Rights_NOGov_t: "Rural Governance"
 Rights_NOGov_d: "The natural domain of the [Prov_Noble_P] is the countryside, and the land they can hold within. Historically societies have seen their fortunes rise and fall as land consolidation eventually takes hold, warping the great wealth agriculture can provide into a tool for elite power. Rural reform can decide what form the aristocracy will take across the realm, and change the fortunes of peasants and landlords alike."
 Rights_NOGov1_t: "§YAlienation (1)§!"
 Rights_NOGov1_title: "[Rights_NOGov1_title]"
 Rights_NOGov1_o: "§gAlienation (1)§!"
 Rights_NOGov1_g: "§GAlienation (1)§!"
 Rights_NOGov1_description: "The countryside is effectively divided by land ownership into a patchwork of fiefs, vassals and autonomous princedoms. The only thing that holds these disparate holdings together is the continued loyalty of their landlords to the regime."
