 Rights_NOObl_d: "The [Prov_Noble_P] can take many forms, and many roles across society. The most ancient of obligations is the call to arms, providing the rural elite with a means to serve and protect the realm at large. With effort however a new role can take hold, shifting obligations from war to the more peaceful yet powerful office desk."
