 Rights_BGCom: "§G[Rights_BGCom_t]§!"
 Rights_BGCom_t: "Commerce"
 Rights_BGCom_d: "Beyond the fields, forests and resources of the countryside, merchants and trade provide the backbone of advanced societies, moving goods across great distances and transforming entire economies through integrated, multi-level networks. Even so, this essential service is not always welcome. Trade can live and die by the supporting framework of the realms they trade in, providing incentive or barriers from state to state. With the right reform and right ideas, a state can take a definitive stance on the role of merchants in the state, and the future of the realm at large."
 Rights_BGCom1_t: "§YCentralised Exchange (1)§!"
 Rights_BGCom1_title: "[Rights_BGCom1_title]"
 Rights_BGCom1_o: "§gCentralised Exchange (1)§!"
 Rights_BGCom1_g: "§GCentralised Exchange (1)§!"
 Rights_BGCom1_description: "The exchange of goods is governed by the realm, facilitating exchange through investment in infrastructure and security for official agents while maintaining a system of stockpiles and exchange points."
 Rights_BGCom1_effects: "\n§YEffects§!\n§R-20.0%§! Ideal Burgher Size Modifier\n§R-80.0%§! Commerce Production\n§R-65.0%§! Merchants from Trade Centers\n(§Y15%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
