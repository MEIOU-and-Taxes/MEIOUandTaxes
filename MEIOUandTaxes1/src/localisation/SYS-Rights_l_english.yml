 Rights_BUTax: "§G[Rights_BUTax_t]§!"
 Rights_BUTax_t: "Tax Collection"
 Rights_BUTax_d: "For a central governing authority to collect revenues beyond the natural relationship between the ruler and the elites, a real administrative apparatus is required as an intermediary. In the absence of such a service, collection can be farmed by private individuals, splitting revenues in exchange for the majority cut. With a real bureaucracy however, advanced flows of wealth can be legally collected across the realm, developing a loyal administration with the capabilities and efficiency to build a real state."
 Rights_BUTax_n: "£mod_2px££estate_bureaucracy_icon_small£ Tax Collection §Y([Rights_BUTaxNum])§!"
 Rights_BUTax1_t: "§YTax Farming (1)§!"
 Rights_BUTax1_title: "[Rights_BUTax1_title]"
 Rights_BUTax1_o: "§gTax Farming (1)§!"
 Rights_BUTax1_g: "§GTax Farming (1)§!"
 Rights_BUTax1_description: "Any and all tax collection is handled by private individuals who, on an annual basis, buy the right to collect taxes, the money they give substituting for actual tax revenue."
