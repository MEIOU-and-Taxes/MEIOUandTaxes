 Rights_CLHie: "§G[Rights_CLHie_t]§!"
 Rights_CLHie_t: "Church Authority"
 Rights_CLHie_d: "The realm of the divine finds its intermediaries on Earth in the form of the Clergy, leaving only the question of the organisation and authority of spiritual institutions. Powerful structures provide abundant resources for use in charitable and benevolent works of the Clergy, while subordinaton and secularity leave all authority in alternative governmental structures, and the Clergy in the role of support."
 Rights_CLHie1_t: "§YSovereign (1)§!"
 Rights_CLHie1_title: "[Rights_CLHie1_title]"
 Rights_CLHie1_o: "§gSovereign (1)§!"
 Rights_CLHie1_g: "§GSovereign (1)§!"
 Rights_CLHie1_description: "The church is effectively a sovereign state independent from the actual state's authority, capable of holding and exercising substantial influence over the government whilst answering only to itself."
