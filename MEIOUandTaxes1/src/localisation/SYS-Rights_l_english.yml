 Rights_BUMer: "§G[Rights_BUMer_t]§!"
 Rights_BUMer_t: "Meritocracy"
 Rights_BUMer_d: "As the administration of a growing state develops sophisticated systems, the bureaucracy will need to reform to meet the needs of the expanding bureaucracy. Elites will attempt to corrupt this new means of rule through their power and autonomy if they feel their needs are not represented otherwise, and only a capable executive can lead the state through serious reform to counter this corrupting element."
