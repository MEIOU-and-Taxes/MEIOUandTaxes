 Plague_Spawner.16.t:0 "A Pestilence Across the Ocean"
 Plague_Spawner.16.d:0 "Letters carried back from the New World tell of a sickness running through the native towns faster than any army could march.\nIn the courts of the Old World the news is little more than a curiosity.\n\n§YHistorical note:§! The disease was §Ysmallpox§!. In our history it reached Mexico in 1520 with the expedition of Pánfilo de Narváez and swept through Tenochtitlan during the Spanish siege; the Aztec ruler Cuitláhuac died of it within months of taking the throne. It then ran ahead of the conquerors into South America, where it probably killed the Inca ruler Huayna Capac around 1527 and helped start the civil war that left the empire divided when Pizarro arrived.\n\nThe old world had lived with smallpox for centuries, and most adults had survived it as children. The peoples of the Americas had never met it, it struck every age group at once. A prime example of a 'virgin soil' epidemic."
 Plague_Spawner.16.a:0 "Strange tidings."
 Plague_Spawner.18.t:0 "Counting the Dead"
 Plague_Spawner.18.d:0 "Years have passed and the New World is still new to many ears.\nSome §R[GV_Plague_AmericaDead1] thousand§! people have died of smallpox there and in places it has still not run its course.\n\n§YHistorical note:§! No one counted the dead at the time, and modern estimates remain disputed. Over the 16th century the native population of the Americas is commonly thought to have fallen by somewhere between half and nine tenths, through smallpox together with measles, influenza, typhus and other diseases, made worse by war, famine and forced labour. The friar Toribio de Benavente, called Motolinía, wrote that in many provinces of Mexico half the people died in the first smallpox outbreak alone."
 Plague_Spawner.18.a:0 "A terrible price."
 Plague_Spawner.20.t:0 "Cocoliztli"
 Plague_Spawner.20.d:0 "From the New World come reports of a new and dreadful sickness. The natives call it §Ycocoliztli§!, 'the pestilence'. Those it takes burn with fever, bleed from the mouth and nose, and are often dead within a few days. It sweeps through the highland towns of the interior, and it is written that there are not enough living left to bury the dead.\n\n§YHistorical note:§! In our history great cocoliztli epidemics struck Mexico in 1545-1548 and again in 1576-1578, and rank among the deadliest epidemics ever recorded. Their cause was argued over for centuries; some suspected a native haemorrhagic fever. In 2018, DNA recovered from victims buried at Teposcolula-Yucundaa in Oaxaca identified §YSalmonella enterica Paratyphi C§!, a cause of enteric (paratyphoid) fever that most likely came over from Europe. It spreads through contaminated food and water, and severe drought may have helped it along."
 Plague_Spawner.20.a:0 "What manner of sickness is this?"
 Plague_Spawner.22.t:0 "The Great Pestilence"
 Plague_Spawner.22.d:0 "Five years on, the cocoliztli has burned through the highlands of the New World. So far some §R[GV_Plague_AmericaDead2] thousand§! are dead.\n\n§YHistorical note:§! Estimates for the 1545 epidemic alone range from about 5 to 15 million deaths, perhaps as much as 80 percent of the native population of Mexico at the time. These figures come from later reconstructions and are uncertain, but they make cocoliztli one of the worst demographic disasters in history."
 Plague_Spawner.22.a:0 "May God have mercy on them."
