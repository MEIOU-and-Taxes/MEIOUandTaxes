l_english:
 mtui_guide_none:0 ""
 # Province view
 mtui_guide_overview_pop1_dev_text:0 "\n--------------------------------------\nRural development: a score derived from what the peasants and nomads of this province earn, averaged over the last years. It is what the province shows as its manpower development. The table above shows its classes in full: needs, population, change and savings.\n\n§GWhy it matters:§! Development is how the rest of the world sees this province: institutions spread to developed provinces, coring and war score cost more, and it raises supply limit and the AI's interest in the province.\n\n§OHow to change it:§! Raise the incomes of the peasants and nomads: more and better farms, pastures, forests, mines and fisheries, higher wages and good trade."
 mtui_tp_guide_overview_pop:0 "\n\n§GWhy it matters:§! They are the workforce of the province, the people we tax and the men we can recruit.\n\n§OHow to change it:§! Keep their needs fulfilled so births outpace deaths; labour shortages raise wages, which attracts migrants."
 mtui_guide_overview_pop1_a_text:0 "\n--------------------------------------\nNumber of peasants and nomads living here, in thousands. The table above shows each class.[mtui_tp_guide_overview_pop]"
 mtui_guide_pop_change_text:0 "\n--------------------------------------\nPopulation change over the last year (thousands): births and deaths, migration, and people moving up or down between classes. Population is simulated once a year, in January. The table above shows each class.\n\n§GWhy it matters:§! A shrinking population means fewer workers, falling output and lower taxes.\n\n§OHow to change it:§! Better needs fulfillment (food first) raises births; good wages draw immigrants from poorer provinces."
 mtui_tp_guide_overview_pop_2:0 "\n\n§GWhy it matters:§! Wealthy people buy more goods (more excise for the state), invest in property and can afford their needs through bad years. Poor people go without, and their needs fulfillment drops.\n\n§OHow to change it:§! Raise their income (wages, property income) or lower what they pay (taxes, levies, high prices)."
 mtui_guide_overview_pop1_c_text:0 "\n--------------------------------------\nAverage savings per person of the peasants and nomads, in ducats. The table above shows the savings per person of each class.[mtui_tp_guide_overview_pop_2]"
 mtui_tp_guide_overview_pop_2_2:0 "\n\n§GWhy it matters:§! Births balance deaths at roughly 72% life fulfillment: below that the population shrinks, above it it grows. Unfulfilled needs also breed discontent.\n\n§OHow to change it:§! Cheaper and more plentiful goods in the province (more farms and fisheries, better trade) and higher incomes."
 mtui_guide_overview_pop1_d_text:0 "\n--------------------------------------\nLife needs fulfillment of the peasants and nomads: how much of their basic needs (food, salt, fibre, fuel) they could actually buy last year. The table above breaks it down into food, life, comfort, luxury and knowledge.[mtui_tp_guide_overview_pop_2_2]"
 mtui_guide_overview_pop2_dev_text:0 "\n--------------------------------------\nUrban development: a score derived from what the residents (town workers) of this province earn, averaged over the last years. It is what the province shows as its production development. The table above shows its classes in full: needs, population, change and savings.\n\n§GWhy it matters:§! Development is how the rest of the world sees this province: institutions spread to developed provinces, coring and war score cost more, and it raises supply limit and the AI's interest in the province.\n\n§OHow to change it:§! Raise the incomes of the residents (town workers): more and better workshops, trade and services, higher wages and good trade."
 mtui_guide_overview_pop2_a_text:0 "\n--------------------------------------\nNumber of residents (town workers) living here, in thousands. The table above shows each class.[mtui_tp_guide_overview_pop]"
 mtui_guide_overview_pop2_c_text:0 "\n--------------------------------------\nAverage savings per person of the residents (town workers), in ducats. The table above shows the savings per person of each class.[mtui_tp_guide_overview_pop_2]"
 mtui_guide_overview_pop2_d_text:0 "\n--------------------------------------\nLife needs fulfillment of the residents (town workers): how much of their basic needs (food, salt, fibre, fuel) they could actually buy last year. The table above breaks it down into food, life, comfort, luxury and knowledge.[mtui_tp_guide_overview_pop_2_2]"
 mtui_guide_overview_pop3_dev_text:0 "\n--------------------------------------\nNotables development: a score derived from what the nobles, burghers and clergy of this province earn, averaged over the last years. It is what the province shows as its tax development. The table above shows its classes in full: needs, population, change and savings.\n\n§GWhy it matters:§! Development is how the rest of the world sees this province: institutions spread to developed provinces, coring and war score cost more, and it raises supply limit and the AI's interest in the province.\n\n§OHow to change it:§! Raise the incomes of the nobles, burghers and clergy: more and better their property, offices and trade, higher wages and good trade."
 mtui_guide_overview_pop3_a_text:0 "\n--------------------------------------\nNumber of nobles, burghers and clergy living here, in thousands. The table above shows each class.[mtui_tp_guide_overview_pop]"
 mtui_guide_overview_pop3_c_text:0 "\n--------------------------------------\nAverage savings per person of the nobles, burghers and clergy, in ducats. The table above shows the savings per person of each class.[mtui_tp_guide_overview_pop_2]"
 mtui_guide_overview_pop3_d_text:0 "\n--------------------------------------\nLife needs fulfillment of the nobles, burghers and clergy: how much of their basic needs (food, salt, fibre, fuel) they could actually buy last year. The table above breaks it down into food, life, comfort, luxury and knowledge.[mtui_tp_guide_overview_pop_2_2]"
 mtui_guide_overview_poptot_dev_text:0 "\n--------------------------------------\nTotal development: rural + urban + notables. It is derived from the incomes of the classes living here, averaged over the last years, and becomes the province's manpower, production and tax development. The table above shows every class.\n\n§GWhy it matters:§! Development is how the rest of the world sees this province: institutions spread to developed provinces, coring and war score cost more, and it raises supply limit and the AI's interest in the province.\n\n§OHow to change it:§! Grow the province economy: more productive property, more people, better wages and trade."
 mtui_guide_overview_poptot_a_text:0 "\n--------------------------------------\nTotal population of the province, in thousands. The table above shows each class.[mtui_tp_guide_overview_pop]"
 mtui_guide_overview_poptot_b_text:0 "\n--------------------------------------\nTotal population change over the last year, in thousands. The table above shows each class.\n\n§GWhy it matters:§! A shrinking population means fewer workers, falling output and lower taxes.\n\n§OHow to change it:§! Better needs fulfillment (food first) raises births; good wages draw immigrants from poorer provinces."
 mtui_guide_overview_poptot_c_text:0 "\n--------------------------------------\nAverage savings per person over all classes, in ducats. The table above shows the savings per person of each class.[mtui_tp_guide_overview_pop_2]"
 mtui_guide_overview_poptot_d_text:0 "\n--------------------------------------\nLife needs fulfillment averaged over all classes (weighted by population). The table above shows each class.[mtui_tp_guide_overview_pop_2_2]"
 mtui_guide_overview_pol1_b_text:0 "\n--------------------------------------\nState reach: how far our own officials can enforce the government's will here, independent of local power brokers. The list above shows what changes it each year.\n\n§GWhy it matters:§! Higher reach lets the state collect more of the taxes it is owed, but corruption grows with the square of it.\n\n§OHow to change it:§! Bureaucratic reforms and administrative rights, advisors, developing the province. Newly gained land starts low."
 mtui_guide_overview_pol3_b_text:0 "\n--------------------------------------\nProvincial corruption: the share of taxes and state property income that officials here divert to the elites before it reaches the treasury. The sources and multipliers are listed above.\n\n§GWhy it matters:§! Corruption is money lost every year, and it feeds the power of the elites who receive it.\n\n§OHow to change it:§! Pay officials better (wage reforms), keep state reach in check, recall corrupt officials, and keep autonomy low and elites loyal."
 mtui_guide_overview_pol4_b_text:0 "\n--------------------------------------\nCommunication efficiency: how quickly the government's messengers reach this province from the capital, over land, along rivers and by sea. 100% in the capital, falling with travel time to 0% for the most remote provinces.\n\n§GWhy it matters:§! Every month it lowers local autonomy (shown above: up to -1.4 per month at 100%). Remote provinces drift towards self-rule and are harder to tax.\n\n§OHow to change it:§! Better roads (infrastructure: pathing), better harbours, regional capitals (capitol infrastructure), and a capital in the heart of the realm."
 mtui_guide_overview_pol5_1_text:0 "\n--------------------------------------\nLeft: loyalty of the local clans. Right: their power in this province.\n\n§GWhy it matters:§! Powerful clans take a larger share of the province's income and property and must be kept content. Powerful and disloyal elites cause unrest and can rise up.\n\n§OHow to change it:§! Rights, privileges and reforms (Nation Atlas) set their resting power; favours and interactions change their loyalty."
 mtui_guide_overview_pol5_2_text:0 "\n--------------------------------------\nLeft: loyalty of the local burghers. Right: their power in this province. Entrenchment builds up while their power stays above its resting level and raises that level: power held long enough becomes hard to remove.\n\n§GWhy it matters:§! Powerful burghers take a larger share of the province's income and property and must be kept content. Powerful and disloyal elites cause unrest and can rise up.\n\n§OHow to change it:§! Rights, privileges and reforms (Nation Atlas) set their resting power; favours and interactions change their loyalty."
 mtui_guide_overview_pol5_3_text:0 "\n--------------------------------------\nLeft: loyalty of the local nobles. Right: their power in this province. Entrenchment builds up while their power stays above its resting level and raises that level: power held long enough becomes hard to remove.\n\n§GWhy it matters:§! Powerful nobles take a larger share of the province's income and property and must be kept content. Powerful and disloyal elites cause unrest and can rise up.\n\n§OHow to change it:§! Rights, privileges and reforms (Nation Atlas) set their resting power; favours and interactions change their loyalty."
 mtui_guide_overview_pol5_4_text:0 "\n--------------------------------------\nLeft: loyalty of the local clergy. Right: their power in this province. Entrenchment builds up while their power stays above its resting level and raises that level: power held long enough becomes hard to remove.\n\n§GWhy it matters:§! Powerful clergy take a larger share of the province's income and property and must be kept content. Powerful and disloyal elites cause unrest and can rise up.\n\n§OHow to change it:§! Rights, privileges and reforms (Nation Atlas) set their resting power; favours and interactions change their loyalty."
 mtui_guide_overview_eco_total_resource_text:0 "\n--------------------------------------\nAll resource property (farmland, forestry, extraction, fisheries): size / maximum, and gross income last year.\n\n§GWhy it matters:§! Resources feed the population and supply the workshops.\n\n§OHow to change it:§! Invest in farmland, forestry, mines or fisheries (Buildings panel), up to the maximum shown. The elites also invest on their own where it pays; property that runs at a loss shrinks."
 mtui_guide_overview_eco_total_industry_text:0 "\n--------------------------------------\nAll building property (industrial, academic, commercial): size and gross income last year.\n\n§GWhy it matters:§! Buildings turn raw goods into finished goods and services; they pay more than resources but need workers and inputs.\n\n§OHow to change it:§! Invest in industries or open new ones (Buildings panel). The elites also invest on their own where it pays; industries that run at a loss shrink and eventually close."
 mtui_tp_guide_overview:0 "\n\n§GWhy it matters:§! Property employs the population, produces the goods people need and pays its owners (classes or the state). Owners pay property tax.\n\n§OHow to change it:§! Owners invest their wealth into new property; the state can build or buy property. Click the button to show this sector on the Property & Industry tab."
 mtui_guide_overview_farmland_a_text:0 "\n--------------------------------------\nFarmland: the size of all fields and pastures in this province (house icon), and the gross income they made last year. The second number is the most the province can hold, set by its land and terrain.[mtui_tp_guide_overview]"
 mtui_guide_overview_forestry_a_text:0 "\n--------------------------------------\nForestry: the size of all woodland worked for timber, charcoal and the like in this province (house icon), and the gross income they made last year. The second number is the most the province can hold, set by its land and terrain.[mtui_tp_guide_overview]"
 mtui_guide_overview_mines_a_text:0 "\n--------------------------------------\nExtraction: the size of all mines and quarries in this province (house icon), and the gross income they made last year. The second number is the most the province can hold, set by its land and terrain.[mtui_tp_guide_overview]"
 mtui_guide_overview_fishery_a_text:0 "\n--------------------------------------\nFisheries: the size of all fishing grounds in this province (house icon), and the gross income they made last year. The second number is the most the province can hold, set by its land and terrain.[mtui_tp_guide_overview]"
 mtui_guide_overview_industrial_a_text:0 "\n--------------------------------------\nIndustrial property: the size of all workshops and manufactories in this province (house icon), and the gross income they made last year.[mtui_tp_guide_overview]"
 mtui_guide_overview_knowledge_a_text:0 "\n--------------------------------------\nAcademic property: the size of all schools, scriptoria and other places of learning in this province (house icon), and the gross income they made last year.[mtui_tp_guide_overview]"
 mtui_guide_overview_commerce_a_text:0 "\n--------------------------------------\nCommercial property: the size of all markets, shops and trading houses in this province (house icon), and the gross income they made last year.[mtui_tp_guide_overview]"
 mtui_guide_overview_eco8_text:0 "\n--------------------------------------\nIndirect taxes collected here last year: taxes on trade and consumption (fees, tariffs, excises).\n\n§GWhy it matters:§! Indirect taxes grow with the wealth and spending of the population, without touching their savings directly.\n\n§OHow to change it:§! A richer, spending population and more trade; tax rights and reforms in the Nation Atlas, State tab."
 mtui_guide_overview_eco9_text:0 "\n--------------------------------------\nDirect taxes collected here last year: taxes on land, property, rents and people.\n\n§GWhy it matters:§! The backbone of state income, but heavy direct taxes drain the wealth of the classes paying them.\n\n§OHow to change it:§! Higher state reach collects more of what is owed; tax rights and reforms set the rates (Nation Atlas)."
 mtui_guide_overview_eco10_text:0 "\n--------------------------------------\nTax farming: taxes collected here by private tax farmers, who keep this much for themselves.\n\n§GWhy it matters:§! Money taken from the people that never reaches the state.\n\n§OHow to change it:§! Tax farming is set by the tax system of the bureaucracy (Nation Atlas, State tab). More state reach lets our own officials collect instead."
 mtui_guide_overview_eco11_text:0 "\n--------------------------------------\nTaxes lost to provincial corruption here last year.\n\n§GWhy it matters:§! Lost income for the state that ends up with the elites.\n\n§OHow to change it:§! See the corruption value in the political section for its causes."
 mtui_guide_overview_mil1_text:0 "\n--------------------------------------\nMen of fighting age in this province, in thousands: the most it could ever provide.\n\n§GWhy it matters:§! Every levy, volunteer and conscript comes out of this pool, and men under arms are missing as workers.\n\n§OHow to change it:§! Grows with the population."
 mtui_guide_overview_mil2_text:0 "\n--------------------------------------\nHow many men the state and the elites aim to keep under arms from this province, in thousands.\n\n§GWhy it matters:§! This becomes our manpower. Raising it costs money (state recruitment) or relies on the elites (levies).\n\n§OHow to change it:§! The military budget (Nation Atlas, Budget tab) sets the state's share; loyal, powerful elites provide more levies."
 mtui_tp_guide_population:0 "\n\n§GWhy it matters:§! Population changes once a year, in January. Each class works, consumes, pays taxes and provides soldiers differently.\n\n§OHow to change it:§! Births follow needs fulfillment; migrants follow wages and wealth; promotion follows jobs and amenities."
 mtui_guide_population_sf_1_text:0 "\n--------------------------------------\nThe peasants of this province and how their number changed last year. §YFreedom§! is the share of peasants who are free rather than serfs. Serfs cannot move away: low freedom (and strong noble tenure rights) holds back migration, and unfree peasants are discontent when welfare is a concern. Promoted and demoted are people moving between classes: green joins this class, red leaves it.[mtui_tp_guide_population]"
 mtui_tp_guide_population_2:0 "\n\n§GWhy it matters:§! Food and life needs decide births and deaths (they balance at roughly 72% life fulfillment). Comfort and luxury needs only matter once the basics are met, and keep wealthier classes content.\n\n§OHow to change it:§! More supply in the province (production, trade), lower prices, or higher incomes."
 mtui_guide_population_sf_a_1_text:0 "\n--------------------------------------\nFood needs fulfillment of the peasants: how much of the grain, fish, livestock and other food they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_sf_a_2_text:0 "\n--------------------------------------\nLife needs fulfillment of the peasants: how much of the salt, fibre/cloth and fuel they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_sf_a_3_text:0 "\n--------------------------------------\nComfort needs fulfillment of the peasants: how much of the everyday goods: raw materials, consumer goods, naval goods they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_sf_a_4_text:0 "\n--------------------------------------\nLuxury needs fulfillment of the peasants: how much of the exotic goods, fine wares and knowledge they want they could buy.[mtui_tp_guide_population_2]"
 mtui_tp_guide_population_2_2:0 "\n\n§GWhy it matters:§! A shortage drives wages up and attracts migrants; a surplus means unemployment, low wages and emigration.\n\n§OHow to change it:§! New property creates jobs; population growth and migration add workers."
 mtui_guide_population_sf_labor_1_text:0 "\n--------------------------------------\nLabour of the peasants: the difference between the work they can supply and the jobs that need them (green: more workers than jobs, red: shortage), and below it their wage.[mtui_tp_guide_population_2_2]"
 mtui_guide_population_nm_1_text:0 "\n--------------------------------------\nThe nomads of this province and how their number changed last year. Promoted and demoted are people moving between classes: green joins this class, red leaves it.[mtui_tp_guide_population]"
 mtui_guide_population_nm_a_1_text:0 "\n--------------------------------------\nFood needs fulfillment of the nomads: how much of the grain, fish, livestock and other food they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_nm_a_2_text:0 "\n--------------------------------------\nLife needs fulfillment of the nomads: how much of the salt, fibre/cloth and fuel they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_nm_a_3_text:0 "\n--------------------------------------\nComfort needs fulfillment of the nomads: how much of the everyday goods: raw materials, consumer goods, naval goods they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_nm_a_4_text:0 "\n--------------------------------------\nLuxury needs fulfillment of the nomads: how much of the exotic goods, fine wares and knowledge they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_nm_labor_1_text:0 "\n--------------------------------------\nLabour of the nomads: the difference between the work they can supply and the jobs that need them (green: more workers than jobs, red: shortage), and below it their wage.[mtui_tp_guide_population_2_2]"
 mtui_guide_population_re_1_text:0 "\n--------------------------------------\nThe residents of this province and how their number changed last year. The red number is the §Yideal size§!: how many residents the town can house, set by its amenities. Peasants are promoted to residents (or residents demoted) towards it. Promoted and demoted are people moving between classes: green joins this class, red leaves it.[mtui_tp_guide_population]"
 mtui_guide_population_re_a_1_text:0 "\n--------------------------------------\nFood needs fulfillment of the residents: how much of the grain, fish, livestock and other food they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_re_a_2_text:0 "\n--------------------------------------\nLife needs fulfillment of the residents: how much of the salt, fibre/cloth and fuel they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_re_a_3_text:0 "\n--------------------------------------\nComfort needs fulfillment of the residents: how much of the everyday goods: raw materials, consumer goods, naval goods they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_re_a_4_text:0 "\n--------------------------------------\nLuxury needs fulfillment of the residents: how much of the exotic goods, fine wares and knowledge they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_re_labor_1_text:0 "\n--------------------------------------\nLabour of the residents: the difference between the work they can supply and the jobs that need them (green: more workers than jobs, red: shortage), and below it their wage.[mtui_tp_guide_population_2_2]"
 mtui_guide_population_bg_1_text:0 "\n--------------------------------------\nThe burghers of this province and how their number changed last year. The red number is the §Yideal size§!: how many burghers the commerce here can employ. Residents are promoted to burghers (or burghers demoted) towards it. Promoted and demoted are people moving between classes: green joins this class, red leaves it.[mtui_tp_guide_population]"
 mtui_guide_population_bg_a_1_text:0 "\n--------------------------------------\nFood needs fulfillment of the burghers: how much of the grain, fish, livestock and other food they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_bg_a_2_text:0 "\n--------------------------------------\nLife needs fulfillment of the burghers: how much of the salt, fibre/cloth and fuel they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_bg_a_3_text:0 "\n--------------------------------------\nComfort needs fulfillment of the burghers: how much of the everyday goods: raw materials, consumer goods, naval goods they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_bg_a_4_text:0 "\n--------------------------------------\nLuxury needs fulfillment of the burghers: how much of the exotic goods, fine wares and knowledge they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_bg_labor_1_text:0 "\n--------------------------------------\nLabour of the burghers: the difference between the work they can supply and the jobs that need them (green: more workers than jobs, red: shortage), and below it their wage.[mtui_tp_guide_population_2_2]"
 mtui_guide_population_no_1_text:0 "\n--------------------------------------\nThe nobles of this province and how their number changed last year. Promoted and demoted are people moving between classes: green joins this class, red leaves it.[mtui_tp_guide_population]"
 mtui_guide_population_no_a_1_text:0 "\n--------------------------------------\nFood needs fulfillment of the nobles: how much of the grain, fish, livestock and other food they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_no_a_2_text:0 "\n--------------------------------------\nLife needs fulfillment of the nobles: how much of the salt, fibre/cloth and fuel they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_no_a_3_text:0 "\n--------------------------------------\nComfort needs fulfillment of the nobles: how much of the everyday goods: raw materials, consumer goods, naval goods they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_no_a_4_text:0 "\n--------------------------------------\nLuxury needs fulfillment of the nobles: how much of the exotic goods, fine wares and knowledge they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_no_labor_1_text:0 "\n--------------------------------------\nLabour of the nobles: the work they can supply. Nobles do not work for wages, so no wage or shortage is shown."
 mtui_guide_population_cl_1_text:0 "\n--------------------------------------\nThe clergy of this province and how their number changed last year. Promoted and demoted are people moving between classes: green joins this class, red leaves it.[mtui_tp_guide_population]"
 mtui_guide_population_cl_a_1_text:0 "\n--------------------------------------\nFood needs fulfillment of the clergy: how much of the grain, fish, livestock and other food they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_cl_a_2_text:0 "\n--------------------------------------\nLife needs fulfillment of the clergy: how much of the salt, fibre/cloth and fuel they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_cl_a_3_text:0 "\n--------------------------------------\nComfort needs fulfillment of the clergy: how much of the everyday goods: raw materials, consumer goods, naval goods they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_cl_a_4_text:0 "\n--------------------------------------\nLuxury needs fulfillment of the clergy: how much of the exotic goods, fine wares and knowledge they want they could buy.[mtui_tp_guide_population_2]"
 mtui_guide_population_cl_labor_1_text:0 "\n--------------------------------------\nLabour of the clergy: the difference between the work they can supply and the jobs that need them (green: more workers than jobs, red: shortage), and below it their wage.[mtui_tp_guide_population_2_2]"
 mtui_tp_guide_class_budget:0 "\n\n§GWhy it matters:§! What is left over becomes savings and investment. A class that spends more than it earns runs down its savings and soon cannot afford its needs.\n\n§OHow to change it:§! Taxes and levy rates are set through rights and reforms (Nation Atlas); income grows with jobs, wages and property."
 mtui_guide_class_budget_sf_text:0 "\n--------------------------------------\nYearly budget of the peasants: what they earned, spent, invested and paid in taxes, and the men they provided as levies.[mtui_tp_guide_class_budget]"
 mtui_guide_class_budget_nm_text:0 "\n--------------------------------------\nYearly budget of the nomads: what they earned, spent, invested and paid in taxes, and the men they provided as levies.[mtui_tp_guide_class_budget]"
 mtui_guide_class_budget_re_text:0 "\n--------------------------------------\nYearly budget of the residents: what they earned, spent, invested and paid in taxes, and the men they provided as levies.[mtui_tp_guide_class_budget]"
 mtui_guide_class_budget_bg_text:0 "\n--------------------------------------\nYearly budget of the burghers: what they earned, spent, invested and paid in taxes, and the men they provided as levies.[mtui_tp_guide_class_budget]"
 mtui_guide_class_budget_no_text:0 "\n--------------------------------------\nYearly budget of the nobles: what they earned, spent, invested and paid in taxes, and the men they provided as levies.[mtui_tp_guide_class_budget]"
 mtui_guide_class_budget_cl_text:0 "\n--------------------------------------\nYearly budget of the clergy: what they earned, spent, invested and paid in taxes, and the men they provided as levies.[mtui_tp_guide_class_budget]"
 mtui_guide_industry_slot_text:0 "\n--------------------------------------\nOne industry slot of this province. Size: how much of the industry exists here; throughput: the share of that size that actually worked last year; skill: how skilled its workforce is, against the most it can reach here. Income is what it earned, spending what it paid for inputs and wages, profitability the margin between them.\n\n§GWhy it matters:§! Profit is the income of whoever owns the industry (a class or the state). Low throughput means idle capacity.\n\n§OHow to change it:§! Workers, cheap inputs and demand for its goods raise throughput and profit. New industries are founded and funded in the Buildings panel (investments), and ownership can be changed by buying or confiscating property."
 mtui_tp_guide_state_economics:0 "\n\n§GWhy it matters:§! Each tax hits a different part of their income or wealth: heavy taxes on savings or land drain a class, taxes on spending grow with prosperity.\n\n§OHow to change it:§! Tax rights and reforms set which taxes exist and how high they are (Nation Atlas, State tab); state reach decides how much of it is actually collected."
 mtui_guide_state_economics_peasants_text:0 "\n--------------------------------------\nTaxes the state collected from the peasants of this province last year. §YFees§!: charges for justice and official services. §YRents§!: rent on state-owned land. §YSerfdom§!: the state's share of serf labour dues. §YPoll§!: a tax per head. §YExcises§!: taxes on goods bought. §YLand§!: tax on land holdings. §YProperty§!: tax on property income. §YChattel§!: tax on savings and movable wealth. §YInheritance§!: tax on estates passed on.[mtui_tp_guide_state_economics]"
 mtui_guide_state_economics_nomads_text:0 "\n--------------------------------------\nTaxes the state collected from the nomads (paid by the clans) of this province last year. §YTributes§!: dues paid by the clans.[mtui_tp_guide_state_economics]"
 mtui_guide_state_economics_residents_text:0 "\n--------------------------------------\nTaxes the state collected from the residents of this province last year. §YFees§!: charges for justice and official services. §YRents§!: rent on state-owned land. §YPoll§!: a tax per head. §YExcises§!: taxes on goods bought. §YProperty§!: tax on property income. §YChattel§!: tax on savings and movable wealth. §YInheritance§!: tax on estates passed on.[mtui_tp_guide_state_economics]"
 mtui_guide_state_economics_nobles_text:0 "\n--------------------------------------\nTaxes the state collected from the nobles of this province last year. §YFees§!: charges for justice and official services. §YObligation§!: dues the elites owe the crown. §YTributes§!: dues paid by the clans. §YPoll§!: a tax per head. §YLand§!: tax on land holdings. §YExcises§!: taxes on goods bought. §YProperty§!: tax on property income. §YChattel§!: tax on savings and movable wealth. §YInheritance§!: tax on estates passed on.[mtui_tp_guide_state_economics]"
 mtui_guide_state_economics_clergy_text:0 "\n--------------------------------------\nTaxes the state collected from the clergy of this province last year. §YFees§!: charges for justice and official services. §YObligation§!: dues the elites owe the crown. §YPoll§!: a tax per head. §YLand§!: tax on land holdings. §YExcises§!: taxes on goods bought. §YProperty§!: tax on property income. §YChattel§!: tax on savings and movable wealth. §YInheritance§!: tax on estates passed on.[mtui_tp_guide_state_economics]"
 mtui_guide_state_economics_burghers_text:0 "\n--------------------------------------\nTaxes the state collected from the burghers of this province last year. §YFees§!: charges for justice and official services. §YCommerce§!: tax on trade and business. §YRents§!: rent on state-owned land. §YObligation§!: dues the elites owe the crown. §YPoll§!: a tax per head. §YLand§!: tax on land holdings. §YExcises§!: taxes on goods bought. §YProperty§!: tax on property income. §YChattel§!: tax on savings and movable wealth. §YInheritance§!: tax on estates passed on.[mtui_tp_guide_state_economics]"
 mtui_guide_state_economics_bureaucracy_text:0 "\n--------------------------------------\nAll state income from this province last year: indirect taxes (on trade and spending) plus direct taxes (on land, property and people) give the revenue; tax farmers' cut and corruption are subtracted to give the total.\n\n§GWhy it matters:§! This is what the province actually contributes to the treasury.\n\n§OHow to change it:§! Grow the province economy, raise state reach, and fight corruption and tax farming."
 mtui_guide_state_property_costs_text:0 "\n--------------------------------------\nWhat the state spent last year on the property it owns here (upkeep, wages, inputs).\n\n§GWhy it matters:§! State property earns income for the treasury but has running costs; unprofitable property is a drain."
 mtui_guide_state_economics_bureaucracy_4_text:0 "\n--------------------------------------\nProvincial corruption and its last change, state reach, and tax efficiency: the share of the taxes owed that officials actually collect here.\n\n§GWhy it matters:§! Low efficiency means taxes the people pay never arrive; corruption diverts what does arrive.\n\n§OHow to change it:§! More state reach and a better tax system raise efficiency; see the corruption tooltip on the overview tab."
 mtui_guide_state_economics_bureaucracy_5_text:0 "\n--------------------------------------\nThe provincial administration: how effective it is, the tax system it runs, how well it is staffed (coverage: officials hired versus needed), whether their wages are enough, and what their wages cost.\n\n§GWhy it matters:§! Understaffed or underpaid officials collect less and are more corrupt.\n\n§OHow to change it:§! Bureaucratic reforms (hiring, wages, tax system) in the Nation Atlas, State tab."
 mtui_guide_military_na_1_text:0 "\n\n§GWhy it matters:§! These men make up our manpower. While under arms they are missing from the workforce.\n\n§OHow to change it:§! The military budget (Nation Atlas, Budget tab) sets the state's target; the elites' levies depend on their power, loyalty and obligations."
 mtui_guide_force_recruits_text:0 "\n--------------------------------------\nWhere the men come from, by class (current men and recruits on the way): peasants, residents, nobles, burghers, clergy and special troops, as far as this force recruits them.\n\n§GWhy it matters:§! Each class loses workers to the army; drafting heavily from one class hurts its output.\n\n§OHow to change it:§! More people of a class mean more men from it: grow the population. The military budget and recruitment targets (Nation Atlas, Budget tab) and the service rights and reforms of the estates (Nation Atlas, State and estate tabs) decide how many of them are called up."
 mtui_guide_military_na_3_text:0 "\n\n§GWhy it matters:§! Military costs come out of the treasury (state army) or the elites' income (levies).\n\n§OHow to change it:§! Lower the recruitment target or the military budget."
 mtui_guide_military_ch_2_text:0 "\n\n§GWhy it matters:§! Each class loses workers to the army; drafting heavily from one class hurts its output.\n\n§OHow to change it:§! More people of a class mean more men from it: grow the population. The military budget and recruitment targets (Nation Atlas, Budget tab) and the service rights and reforms of the estates (Nation Atlas, State and estate tabs) decide how many of them are called up."
 mtui_guide_military_navy_text:0 "\n\n§GWhy it matters:§! Missing goods leave ships unrepaired and unsupplied.\n\n§OHow to change it:§! Produce or import these goods: naval materials and timber, workshops, fuel."
 mtui_guide_military_goods_text:0 "\n\n§GWhy it matters:§! Armies compete with the population for these goods and drive their prices up.\n\n§OHow to change it:§! Local production and trade of food, salt, fuel and military goods."
 mtui_guide_population_button_strip_text:0 "\n--------------------------------------\nThe people of this province by class: how many, how they grow, their wealth and income, and below it what they consume and how well their needs are met.\n\n§GWhy it matters:§! People are the workforce, the tax base and the source of soldiers. Unmet needs make the population shrink and breed discontent.\n\n§OHow to change it:§! Hover a row for its details; the buttons at the bottom switch between income and the kinds of needs."
 mtui_guide_tab3_button_text:0 "\n--------------------------------------\nWho owns the farmland, buildings and industries of this province, and how each industry here is doing: its size, income, output and profit.\n\n§GWhy it matters:§! Property decides who earns the income of the province and who holds power here.\n\n§OHow to change it:§! Invest in or open new industries (Buildings panel), and grant, buy or confiscate property."
 mtui_guide_tab4_button_text:0 "\n--------------------------------------\nWhat each class here paid the state last year, tax by tax, and what the state spends on this province (property, officials, infrastructure).\n\n§GWhy it matters:§! Shows where revenue really comes from and what the province costs us.\n\n§OHow to change it:§! State reach, the tax rights of the estates, the wealth of the classes and corruption."
 mtui_guide_tab5_button_text:0 "\n--------------------------------------\nThe forces raised in this province (national army, noble levy, citizen militia, clan host): targets, men, costs, and the goods armies and navy consume here.\n\n§GWhy it matters:§! Soldiers cost money and goods, and every man under arms is missing from the workforce.\n\n§OHow to change it:§! The military budget (Nation Atlas), the service rights of the estates, and recruitment."
 mtui_guide_goods_bought_text:0 "\n--------------------------------------\nEach class column shows two numbers per good: top, what they bought last year (green: all they needed, yellow: exactly enough, red: less), bottom, what they need. The nomad column shows the local price, production and demand instead.\n\n§GWhy it matters:§! Unmet needs lower needs fulfillment, which drives births, deaths and discontent.\n\n§OHow to change it:§! More local production or trade lowers prices; higher incomes let people buy more."
 mtui_guide_pv_autonomy_text:0 "\n--------------------------------------\nHow much this province runs its own affairs instead of following the government. Its only direct effect: it pulls itself back down, by 1.5 points per month at 100% (less when lower), so it settles where that pull balances the monthly changes shown on the number.\n\n§GWhy it matters:§! Autonomy multiplies provincial corruption here.\n\n§OHow to change it:§! Communication efficiency (CE on the number) lowers it every month: roads, harbours, regional capitals and a central capital. The base value and powerful local elites raise it; bureaucratic reforms move it either way."
 # Province view: tab buttons
 mtui_guide_province_overview_text:0 "\n--------------------------------------\nThe province at a glance: its people, political situation, economy and military.\n\n§GWhy it matters:§! A quick check of a province before you open one of the detail tabs to the right.\n\n§OHow to change it:§! Click a tab to the right for details; click here to come back."
 # Province view: Population tab, consumption tables
 mtui_guide_pc_food_life_head_text:0 "\n\n§GWhy it matters:§! Unmet needs lower needs fulfillment: food and life needs drive births and deaths, comfort and luxury keep the wealthier classes content.\n\n§OHow to change it:§! More production in the province or its trade node, lower prices, or higher incomes."
 mtui_guide_good_price_text:0 "\n\n§GWhy it matters:§! The price decides how much of their needs the classes can afford, and what producers earn.\n\n§OHow to change it:§! More production here or in the trade node lowers the price; shortages raise it."
 # The realm (top bar, Nation Atlas Overview and State tabs)
 mtui_guide_pop_text:0 "\n--------------------------------------\nEveryone living in provinces we own directly (subjects not included).\n\n§GWhy it matters:§! Population is the workforce for our farms, mines and industries, the base of every tax, and the source of manpower.\n\n§OHow to change it:§! Raise needs fulfillment (food first) so births outpace deaths, keep wages attractive to draw migrants, and build amenities in growing cities."
 mtui_guide_growth_text:0 "\n--------------------------------------\nNatural growth (births minus deaths, negative when more people die than are born), plus people who moved in minus people who moved out, over the last yearly census (population is simulated yearly). People moving between two of our own provinces count as emigration in one and immigration in the other, so those two lines are mostly a measure of how much our people move around.\n\n§GWhy it matters:§! A shrinking population means fewer workers, falling output and lower taxes over time.\n\n§OHow to change it:§! Births equal deaths at about 72% life fulfillment, so feed your people. Labour shortages raise wages, which attract immigrants."
 mtui_guide_wealth_text:0 "\n--------------------------------------\nCash held by all our population classes. It does not include the state treasury, property values or stockpiled goods.\n\n§GWhy it matters:§! Wealthy classes buy more goods (more excise income), invest in their provinces and keep needs fulfilled through bad years. Wealthy elites also gain power.\n\n§OHow to change it:§! Raise incomes: productive properties, good trade rank and moderate taxes. Wealth drains when classes run net-negative income."
 mtui_guide_reach_text:0 "\n--------------------------------------\nHow well our own officials can enforce the government's will across the realm, independent of local power brokers. In brackets: its change at the last yearly census.\n\n§GWhy it matters:§! Higher reach strongly improves how much tax we can collect, but brings more corruption. Some nationwide reforms need a minimum average reach.\n\n§OHow to change it:§! Expand the bureaucracy, pass administrative rights and reforms, appoint advisors, and develop provinces. Newly conquered land often starts low."
 mtui_guide_stab_progress_text:0 "\n--------------------------------------\nProgress moves every month. At 100% Stability rises by one level, at 0% it drops by one.\n\n§GWhy it matters:§! Stability reduces unrest and is required by many reforms and actions.\n\n§OHow to change it:§! Anything that lowers the stability cost modifier speeds up progress: ideas, advisors, government reforms and loyal estates. Tax relief and grain doles grant progress directly."
 mtui_guide_corrupt_text:0 "\n--------------------------------------\nProvincial corruption: officials in the provinces diverting taxes and property income to the elites before the state sees it.\n\n§GWhy it matters:§! High provincial corruption can bankrupt the state and starve its armies; state corruption raises power costs and weakens the country. Both feed each other.\n\n§OHow to change it:§! Pay officials better (wage reforms), keep state reach in check (corruption grows with its square), recall corrupt officials, keep elites loyal and the ruler's authority high."
 mtui_guide_authority_text:0 "\n--------------------------------------\nThe executive weight of the ruler and the institutions behind the throne. It comes mostly from the ruler's skills.\n\n§GWhy it matters:§! Many rights and privileges can only be changed with enough Authority (roughly 40-65%), and a strong ruler limits corruption.\n\n§OHow to change it:§! A capable ruler or regent, advisors, and government reforms and ideas that strengthen the ruler."
 mtui_guide_autonomy_text:0 "\n--------------------------------------\nThe average autonomy of our provinces, a rough gauge of how efficiently we administer the realm.\n\n§GWhy it matters:§! By itself it mostly gates certain reforms, but high autonomy signals weak control and poor taxation.\n\n§OHow to change it:§! Driven by estate power and loyalty, bureaucratic reforms, centralisation and communication efficiency."
 mtui_guide_state_property_text:0 "\n--------------------------------------\nHow much of the property the state may own (fields, mines, workshops) we already hold.\n\n§GWhy it matters:§! State property earns income directly for the treasury but adds to corruption and has to be managed.\n\n§OHow to change it:§! Buy, confiscate or grant property through the state and commoner interactions."
 # Revenue and expenses (top bar, Nation Atlas Overview and Budget tabs)
 mtui_guide_income_text:0 "\n--------------------------------------\nWhat the state collected at the last yearly census, line by line: direct taxes on people and property, indirect taxes on goods, trade and services, and special income, minus what tax farmers and corrupt officials kept.\n\n§GWhy it matters:§! Revenue pays for the bureaucracy, the army, infrastructure and any interest on loans. It is also the base of the military budget.\n\n§OHow to change it:§! Grow population wealth, raise state reach, set tax rights, build trade and fight corruption."
 mtui_guide_expense_text:0 "\n--------------------------------------\nEverything the state paid out of the treasury at the last yearly census. Loan interest and one-off costs are not included.\n\n§GWhy it matters:§! If expenses exceed revenue the treasury drains and loans follow.\n\n§OHow to change it:§! Adjust the military budget and infrastructure funding, or reform the administration."
 mtui_guide_milbudget_text:0 "\n--------------------------------------\nThe share of yearly tax income allowed for recruiting and maintaining state manpower (levies, volunteers, conscripts). Changes apply next year.\n\n§GWhy it matters:§! State manpower costs money, unlike manpower provided by the estates, and it becomes more important as military reforms advance.\n\n§OHow to change it:§! Set it in the Nation Atlas, Budget tab (scroll under the flag)."
 # Estates: loyalty and power (top bar, Nation Atlas)
 mtui_guide_estate_loyalty_text:0 "\n--------------------------------------\nHow content this elite is with our government (in brackets: the change at the last yearly census). It drifts towards 50 and is nudged by our relations with them.\n\n§GWhy it matters:§! Loyal elites cooperate on taxes, provide more levies and volunteers, and are less corrupt. Disloyal, powerful elites can start a civil war.\n\n§OHow to change it:§! Grant privileges and favours, align the cabinet with their interests, and avoid hostile acts (seizing land, cutting their power)."
 mtui_guide_estate_power_text:0 "\n--------------------------------------\nHow much sway this elite holds over the country (in brackets: the change at the last yearly census). It moves towards a resting value set by rights, reforms and their wealth.\n\n§GWhy it matters:§! Powerful elites take a bigger share of taxes and land and must be kept happy. If they are both powerful and disloyal, expect rebellion.\n\n§OHow to change it:§! Pass rights and reforms that curb them, and slowly reduce their property through land reform. Conquests can bring in new elites."
 # Top bar: icons of the values the game itself explains (hover the number for its own tooltip)
 mtui_guide_treasury_text:0 "\n--------------------------------------\nDucats in the state treasury. Almost all tax income arrives once a year, with the census in January.\n\n§GWhy it matters:§! Everything the state does is paid from here: officials, state troops, infrastructure, construction and loan interest.\n\n§OHow to change it:§! See the Nation Atlas, Budget tab: revenue comes from taxing the classes, costs from the military budget, infrastructure funding and welfare."
 mtui_guide_manpower_text:0 "\n--------------------------------------\nMen available to reinforce and raise armies. They come from the population: levies and volunteers provided by the estates, plus state recruitment paid from the military budget.\n\n§GWhy it matters:§! Armies can only reinforce and grow while manpower is available.\n\n§OHow to change it:§! A larger, growing population; loyal estates (they provide more levies); a higher military budget for state recruitment."
 mtui_guide_naval_materials_text:0 "\n--------------------------------------\nNaval materials, used to build, repair and supply ships.\n\n§GWhy it matters:§! Fleets cannot be repaired or reinforced without them.\n\n§OHow to change it:§! Grow timber and naval material industries; demand from a growing navy and harbours stimulates them."
 mtui_guide_stability_text:0 "\n--------------------------------------\nHow settled and orderly the realm is (-3 to +3). Stability moves by a monthly progress bar (shown next to it in the top bar).\n\n§GWhy it matters:§! Stability lowers unrest and is required for many reforms and actions; low stability invites rebellion.\n\n§OHow to change it:§! Lower the stability cost modifier (ideas, advisors, reforms, loyal estates); tax relief and grain doles add progress."
 mtui_guide_state_corruption_text:0 "\n--------------------------------------\nState corruption: the corruption of the central government. (The average provincial corruption has a box of its own in the top bar.)\n\n§GWhy it matters:§! It raises all power costs and weakens trade, forts and legitimacy; it also feeds provincial corruption.\n\n§OHow to change it:§! A competent ruler with enough authority, fewer corruption-causing reforms and privileges, and paying to root out corruption."
 mtui_guide_prestige_text:0 "\n--------------------------------------\nThe standing of our country and dynasty in the eyes of the world. Decays towards zero over time.\n\n§GWhy it matters:§! Helps diplomacy (acceptance of proposals, personal unions), morale, legitimacy and reduces aggressive expansion impact.\n\n§OHow to change it:§! Win battles and wars, hold great titles and rank, and take prestigious decisions and court actions."
 mtui_guide_meritocracy_text:0 "\n--------------------------------------\nHow much offices are filled by merit rather than connections.\n\n§GWhy it matters:§! Low meritocracy raises corruption and weakens the mandate.\n\n§OHow to change it:§! Appoint skilled advisors and generals, and avoid nepotism and corruption."
 mtui_guide_horde_unity_text:0 "\n--------------------------------------\nHow united the clans of the horde are behind the khan.\n\n§GWhy it matters:§! Low horde unity causes unrest and can tear the horde apart.\n\n§OHow to change it:§! Raid and win wars, and keep the clans loyal."
 mtui_guide_devotion_text:0 "\n--------------------------------------\nThe faith of the people in our theocratic rule.\n\n§GWhy it matters:§! Low devotion brings unrest and weakens the theocracy.\n\n§OHow to change it:§! Pious rulers, religious unity and religious decisions."
 mtui_guide_republican_tradition_text:0 "\n--------------------------------------\nHow firmly republican values are rooted in our government.\n\n§GWhy it matters:§! Low republican tradition causes unrest and makes the republic slide towards autocracy.\n\n§OHow to change it:§! Hold regular elections, avoid re-electing the same ruler, and take republican reforms."
 mtui_guide_legitimacy_text:0 "\n--------------------------------------\nHow rightful the ruler's claim to the throne appears.\n\n§GWhy it matters:§! Low legitimacy brings unrest, higher costs and a weaker grip on the realm.\n\n§OHow to change it:§! A capable, legitimate heir and ruler, royal marriages, and avoiding actions that undermine the crown."
 mtui_guide_power_projection_text:0 "\n--------------------------------------\nHow strongly we project power against our rivals.\n\n§GWhy it matters:§! High power projection gives monthly monarch power bonuses and better morale.\n\n§OHow to change it:§! Rivals that are strong, winning against rivals, and great power status."
 # Nation Atlas: Overview tab
 mtui_tp_guide_no_wealth:0 "\n\n§GWhy it matters:§! Wealth turns into power and pays their part of the taxes.\n\n§OHow to change it:§! Their income, which depends on the economy and on their privileges."
 mtui_guide_no_wealth_text:0 "\n--------------------------------------\nThe accumulated wealth of the nobles: each year their income is added and their spending taken off.[mtui_tp_guide_no_wealth]"
 mtui_tp_guide_no_income:0 "\n\n§GWhy it matters:§! Income adds to their wealth and to what the state can tax.\n\n§OHow to change it:§! The economy, their land and property, and privileges that hand them revenue."
 mtui_guide_no_income_text:0 "\n--------------------------------------\nWhat the nobles earned over the last year.[mtui_tp_guide_no_income]"
 mtui_tp_guide_no_land:0 "\n\n§GWhy it matters:§! Land is the main source of power and income in the countryside.\n\n§OHow to change it:§! Land grants, expropriation and land reform."
 mtui_guide_no_land_text:0 "\n--------------------------------------\nShare of the land owned by the nobles, for each kind of land; the total weighs the kinds by their value.[mtui_tp_guide_no_land]"
 mtui_tp_guide_no_prop:0 "\n\n§GWhy it matters:§! Property earns income in the cities and gives power there.\n\n§OHow to change it:§! Property grants and expropriation."
 mtui_guide_no_prop_text:0 "\n--------------------------------------\nShare of the urban property owned by the nobles, for each kind of property; the total weighs the kinds by their value.[mtui_tp_guide_no_prop]"
 mtui_guide_bg_wealth_text:0 "\n--------------------------------------\nThe accumulated wealth of the burghers: each year their income is added and their spending taken off.[mtui_tp_guide_no_wealth]"
 mtui_guide_bg_income_text:0 "\n--------------------------------------\nWhat the burghers earned over the last year.[mtui_tp_guide_no_income]"
 mtui_guide_bg_land_text:0 "\n--------------------------------------\nShare of the land owned by the burghers, for each kind of land; the total weighs the kinds by their value.[mtui_tp_guide_no_land]"
 mtui_guide_bg_prop_text:0 "\n--------------------------------------\nShare of the urban property owned by the burghers, for each kind of property; the total weighs the kinds by their value.[mtui_tp_guide_no_prop]"
 mtui_guide_cl_wealth_text:0 "\n--------------------------------------\nThe accumulated wealth of the clergy: each year their income is added and their spending taken off.[mtui_tp_guide_no_wealth]"
 mtui_guide_cl_income_text:0 "\n--------------------------------------\nWhat the clergy earned over the last year.[mtui_tp_guide_no_income]"
 mtui_guide_cl_land_text:0 "\n--------------------------------------\nShare of the land owned by the clergy, for each kind of land; the total weighs the kinds by their value.[mtui_tp_guide_no_land]"
 mtui_guide_cl_prop_text:0 "\n--------------------------------------\nShare of the urban property owned by the clergy, for each kind of property; the total weighs the kinds by their value.[mtui_tp_guide_no_prop]"
 mtui_guide_trade_rank_text:0 "\n--------------------------------------\nEvery sector center gets a rank each year; rank 1 trades first. This is the best rank among the sector centers we own.\n\n§GWhy it matters:§! Higher ranked centres buy and sell before everyone else: our burghers buy cheaper, sell dearer and grow richer, and our people pay less for goods. Even a few ranks make a large difference.\n\n§OHow to change it:§! Trade power, trade efficiency, merchants and the size of our fleet (trade ships count double) decide the rank."
 mtui_guide_trade_tcent_text:0 "\n--------------------------------------\nA sector is all the provinces of one nation inside one trade node. Its sector center is the province that runs it: usually our province with the most trade power there. A nation has at most one sector center per trade node, but can have centers in several nodes. The center trades with the other nations present in the node and handles the trade between our own sectors.\n\n§GWhy it matters:§! Without a sector center in a node our provinces there cannot take part in its trade. The more nodes we hold a center in, the more of our trade we run ourselves.\n\n§OHow to change it:§! Own provinces in more trade nodes and build up their trade power; the strongest one becomes the center."
 mtui_guide_trade_tariff_text:0 "\n--------------------------------------\nTariffs collected on goods crossing our borders over the last year, part of indirect taxation.\n\n§GWhy it matters:§! Grows with foreign trade through our markets.\n\n§OHow to change it:§! More foreign trade; the commerce and excise rights."
 mtui_guide_trade_commerce_text:0 "\n--------------------------------------\nTaxes on the commerce of the burghers over the last year.\n\n§GWhy it matters:§! Shows how much the state earns from the trade of its cities.\n\n§OHow to change it:§! Richer burghers and better trade rank; the commerce rights of the burghers."
 # Nation Atlas: Budget tab
 mtui_guide_budget_direct_text:0 "\n--------------------------------------\nTaxes levied directly on people and property: rents, land, property, poll, chattel and inheritance taxes, and what state property earns.\n\n§GWhy it matters:§! Usually the bulk of income early on. It depends on how much wealth each class has and how far our officials reach.\n\n§OHow to change it:§! State reach, the tax rights of each estate, and the wealth of the classes. The class lines below show who pays what."
 mtui_guide_budget_indirect_text:0 "\n--------------------------------------\nTaxes on goods, trade and services: fees, tariffs, excises, industry duties (including tolls, timber and alcohol), obligations and more.\n\n§GWhy it matters:§! Grows with trade and consumption, so it rises as the economy develops.\n\n§OHow to change it:§! More trade and richer consumers, plus the commerce and excise rights."
 mtui_guide_budget_special_text:0 "\n--------------------------------------\nIncome that does not come from our provinces: holdings of the Teutonic Order and knightly orders, imperial taxes and trade post fees.\n\n§GWhy it matters:§! Added to revenue on top of the taxes our own officials collect.\n\n§OHow to change it:§! Hold the offices, holdings and trade posts that produce it."
 mtui_guide_budget_farming_text:0 "\n--------------------------------------\nThe share of taxes kept by private tax farmers who collect on our behalf.\n\n§GWhy it matters:§! Tax farming lets a weak state collect at all, but the farmers keep a cut.\n\n§OHow to change it:§! The Tax Farming reform on the State tab: less farming needs a stronger bureaucracy."
 mtui_guide_budget_corruption_text:0 "\n--------------------------------------\nTaxes siphoned off by corrupt officials before they reach the treasury.\n\n§GWhy it matters:§! Corruption tends to grow on itself if left alone.\n\n§OHow to change it:§! See Corruption in the top bar: wages, recalling officials, loyal elites and authority."
 mtui_guide_class_taxes_text:0 "\n--------------------------------------\nWhat this class paid the state last year, by type of tax.\n\n§GWhy it matters:§! Shows who carries the tax burden. Squeezing a class too hard hurts its wealth, needs and loyalty.\n\n§OHow to change it:§! The tax rights of the estate that controls this class, and how wealthy the class is."
 mtui_guide_budget_wages_text:0 "\n--------------------------------------\nWages of the bureaucracy.\n\n§GWhy it matters:§! Underpaid officials turn corrupt.\n\n§OHow to change it:§! Grows with state reach and the Official Wages reform."
 mtui_guide_budget_milmaint_text:0 "\n--------------------------------------\nUpkeep of state manpower and units paid from the treasury.\n\n§GWhy it matters:§! Estate levies are free, state troops are not.\n\n§OHow to change it:§! Army size and composition; the military budget."
 mtui_guide_budget_milrec_text:0 "\n--------------------------------------\nRecruiting state manpower.\n\n§GWhy it matters:§! Determines how much state manpower we can raise.\n\n§OHow to change it:§! The military budget to the right."
 mtui_guide_budget_propneg_text:0 "\n--------------------------------------\nRunning costs of property the state owns, where they exceed what it earns.\n\n§GWhy it matters:§! Owned property earns income but costs upkeep.\n\n§OHow to change it:§! Buy, grant or confiscate property."
 mtui_guide_budget_infra_text:0 "\n--------------------------------------\nUpkeep the state pays for infrastructure.\n\n§GWhy it matters:§! Unfunded infrastructure decays unless the elites pay for it.\n\n§OHow to change it:§! Infrastructure funding in the middle column."
 mtui_guide_budget_dole_text:0 "\n--------------------------------------\nGrain handed out to commoners.\n\n§GWhy it matters:§! Feeds the poor and buys stability.\n\n§OHow to change it:§! The grain dole buttons to the right."
 mtui_guide_budget_colonial_text:0 "\n--------------------------------------\nSupport paid to our colonies.\n\n§GWhy it matters:§! Colonies grow faster with support.\n\n§OHow to change it:§! Colonial policy and the number of colonies."
 mtui_guide_budget_bal_text:0 "\n--------------------------------------\nRevenue minus expenses over the last year. Loans, interest and non-tax income are not included.\n\n§GWhy it matters:§! A lasting deficit drains the treasury and leads to loans and, eventually, bankruptcy.\n\n§OHow to change it:§! Raise revenue (reach, wealth, tax rights) or cut costs (military budget, infrastructure, welfare)."
 mtui_tp_guide_infra_funding:0 "\n\n§GWhy it matters:§! Infrastructure the state does not pay for is maintained only where the elites see a benefit; the rest decays.\n\n§OHow to change it:§! Pick a share below, then press Apply. 100% means the state pays all upkeep in those provinces."
 mtui_guide_infra_funding_Capitol_text:0 "\n--------------------------------------\nAdministrative buildings and courts. Supports state reach and administration.[mtui_tp_guide_infra_funding]"
 mtui_guide_infra_funding_Harbourage_text:0 "\n--------------------------------------\nPorts and docks. Needed for naval capacity and sea trade.[mtui_tp_guide_infra_funding]"
 mtui_guide_infra_funding_Amenities_text:0 "\n--------------------------------------\nUrban services. Without them city death rates rise as cities outgrow them.[mtui_tp_guide_infra_funding]"
 mtui_guide_infra_funding_Pathing_text:0 "\n--------------------------------------\nRoads and bridges. Improve communication efficiency and trade.[mtui_tp_guide_infra_funding]"
 mtui_guide_infra_funding_Irrigation_text:0 "\n--------------------------------------\nWater works for farmland. Raise agricultural output.[mtui_tp_guide_infra_funding]"
 mtui_guide_infra_funding_Garrison_text:0 "\n--------------------------------------\nFortifications and garrisons. Defence and local control.[mtui_tp_guide_infra_funding]"
 # Nation Atlas: State tab
 mtui_tp_guide_reform_BU:0 "\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_guide_reform_BUOffice_text:0 "\n--------------------------------------\n[Privilege_BUOffice_d][mtui_tp_guide_reform_BU]"
 mtui_guide_reform_BUFarm_text:0 "\n--------------------------------------\n[Privilege_BUFarm_d][mtui_tp_guide_reform_BU]"
