 mtui_guide_reform_BURotate_text:0 "\n--------------------------------------\n[Privilege_BURotate_d][mtui_tp_guide_reform_BU]"
 mtui_guide_rights_BUTax_text:0 "\n--------------------------------------\n[Rights_BUTax_d]\n\n§GWhy it matters:§! Decides who collects the taxes: private tax farmers who keep a cut, or salaried officials. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_guide_rights_BUDir_text:0 "\n--------------------------------------\n[Rights_BUDir_d]\n\n§GWhy it matters:§! How far the state may tax people and property directly, instead of relying on the elites. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_guide_rights_BUInd_text:0 "\n--------------------------------------\n[Rights_BUInd_d]\n\n§GWhy it matters:§! How far the state may tax trade and goods (excises, tariffs). Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_guide_rights_BUSer_text:0 "\n--------------------------------------\n[Rights_BUSer_d]\n\n§GWhy it matters:§! How soldiers are raised: through the elites, or by the state itself. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_guide_reform_package_text:0 "\n--------------------------------------\nChanges to the rights of the state and of the estates are passed as a reform package: a single change enacted right away, or several changes planned together. A package is enacted automatically six months after its first change, or earlier with Enact now.\n\n§GWhy it matters:§! Reform unsettles the realm. Every package costs stability and legitimacy and leaves the administration unable to pass new rights reforms for years. The more you change at once, the harsher the blow: the elites object to changes that touch them, and an estate pushed too far may rise in civil war.\n\n§OHow to change it:§! Be cautious: change little at a time, and enact at high stability and with strong executive authority. Backing down drops the whole package, at a cost to our authority."
 mtui_guide_reform_severity_text:0 "\n--------------------------------------\nHow disruptive the planned package is. Every change adds to it; it is multiplied by a stability factor (x1.1 to x1.5 at very high or very low stability) and by executive authority (weak authority makes it worse).\n\n§GWhy it matters:§! The severity decides the penalty when the package is enacted: from -50% stability progress (minor) to -5 stability and more (extreme), plus legitimacy and years of more expensive stability. Above 10 no further changes can be added.\n\n§OHow to change it:§! Plan fewer changes, raise stability and executive authority before enacting."
 # Nation Atlas: Nobles tab
 mtui_tp_guide_privilege_NO:0 "\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_guide_privilege_NOProcessing_text:0 "\n--------------------------------------\n[Privilege_NOProcessing_d][mtui_tp_guide_privilege_NO]"
 mtui_guide_privilege_NOGame_text:0 "\n--------------------------------------\n[Privilege_NOGame_d][mtui_tp_guide_privilege_NO]"
