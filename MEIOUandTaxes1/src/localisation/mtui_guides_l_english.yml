 mtui_guide_privilege_NOServiceE_text:0 "\n--------------------------------------\n[Privilege_NOServiceE_d][mtui_tp_guide_privilege_NO]"
 mtui_tp_guide_no_rel:0 "\n\n§GWhy it matters:§! Relations set the loyalty the estate settles at: from hostile (-100) to friendly (+100) its resting loyalty rises by 50 points. Together with the faction's influence and the estate's power they also add to our yearly legitimacy (or its equivalent for our government).\n\n§OHow to change it:§! Many actions and reforms change them: support and favours improve them, pressure, crackdowns and reforms against them worsen them."
 mtui_guide_no_rel_text:0 "\n--------------------------------------\nHow the faction of the nobles at court and the state get along (-100 to +100).[mtui_tp_guide_no_rel]"
 mtui_tp_guide_rights_NO:0 "\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_guide_rights_NOGov_text:0 "\n--------------------------------------\n[Rights_NOGov_d][mtui_tp_guide_rights_NO]"
 mtui_guide_rights_NOObl_text:0 "\n--------------------------------------\n[Rights_NOObl_d][mtui_tp_guide_rights_NO]"
 mtui_guide_rights_NOTen_text:0 "\n--------------------------------------\n[Rights_NOTen_d][mtui_tp_guide_rights_NO]"
 mtui_guide_rights_NOSer_text:0 "\n--------------------------------------\n[Rights_NOSer_d][mtui_tp_guide_rights_NO]"
 # Nation Atlas: Burghers tab
 mtui_tp_guide_privilege_BG:0 "\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_guide_privilege_BGIndustry_text:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise heavy industry. A monopoly hands them part of its revenue and raises their power.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGLuxury_text:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise the luxury industries. A monopoly hands them part of their revenue and raises their power.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGConsumerGoods_text:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise consumer goods such as cloth and textiles. A monopoly hands them part of their revenue and raises their power.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGAutonomy_text:0 "\n--------------------------------------\nPLACEHOLDER: How freely the cities run their own affairs. More autonomy raises burgher power and their say at court, and the cities need fewer officials, but tollage becomes more costly to collect.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGPatent_text:0 "\n--------------------------------------\nPLACEHOLDER: How inventions and products are protected, from civic trade laws upheld by the state down to no protection at all. Weaker protection raises burgher gravity and local corruption.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGCivic_text:0 "\n--------------------------------------\nPLACEHOLDER: Who sits on the city councils: people chosen on merit, the well connected, the wealthy, or the nobility. Each step moves influence, autonomy and a share of urban revenue towards the burghers or the nobles.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGOligopolization_text:0 "\n--------------------------------------\nPLACEHOLDER: How concentrated burgher wealth and power are. A few rich merchant families gain influence, and burgher power and loyalty swing faster.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGRuralOwnership_text:0 "\n--------------------------------------\nPLACEHOLDER: How far city merchants may buy up the countryside. Speculation brings the burghers peasant dues and power at the expense of the rural order.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGGuild_text:0 "\n--------------------------------------\nPLACEHOLDER: How entrenched the guilds are. Guilds raise urban skills but stifle competition, and bring the burghers power and local corruption.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGLicensing_text:0 "\n--------------------------------------\nPLACEHOLDER: Who may license new businesses: a merit-based office, the sovereign, or no one at all. Weaker licensing sends urban revenue to the nobles and hurts trade.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGTaxE_text:0 "\n--------------------------------------\nPLACEHOLDER: How much tax the burghers actually owe. Every exemption makes charter fees harder to collect.[mtui_tp_guide_privilege_BG]"
 mtui_guide_privilege_BGServiceE_text:0 "\n--------------------------------------\nPLACEHOLDER: What the cities owe the realm in naval materials and service. Exemptions make the citizen militia more costly and lower our naval capacity.[mtui_tp_guide_privilege_BG]"
 mtui_guide_bg_rel_text:0 "\n--------------------------------------\nHow the faction of the burghers at court and the state get along (-100 to +100).[mtui_tp_guide_no_rel]"
 mtui_guide_rights_BGCom_text:0 "\n--------------------------------------\n[Rights_BGCom_d]\n\n§GWhy it matters:§! Sets what the burghers may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_guide_rights_BGGov_text:0 "\n--------------------------------------\n[Rights_BGGov_d]\n\n§GWhy it matters:§! Sets what the burghers may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
