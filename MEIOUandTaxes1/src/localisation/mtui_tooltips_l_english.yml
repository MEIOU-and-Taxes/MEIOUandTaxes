 mtui_bw_invest_agriculture_tt:0 "§YInvest in agriculture§! here (the amount picked above)\nThe money expands this sector: more jobs and higher wages, which draw people to the province. How much property it buys depends on the local prices of what the sector needs to grow; it starts to apply next year.\n\n§RPart of it is lost§! to the local elites, the more the higher provincial corruption. Too much investment grows a sector quickly but can make it unprofitable and slows construction in the province."
