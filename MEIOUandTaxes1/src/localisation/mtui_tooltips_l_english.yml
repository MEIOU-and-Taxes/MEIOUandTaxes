 # Province view: build panel shortcuts
 mtui_bw_build_capitol_tt:0 "§YBuild Capitol§! (+1 level)\nOpens the construction dialog for §YCapitol§!, administrative buildings: state reach and administration, in §Yevery pinned province§! (ours and our subjects'), with its costs and contributions.\n§gAlso pins this province.§!"
 mtui_bw_build_amenities_tt:0 "§YBuild Amenities§! (+1 level)\nOpens the construction dialog for §YAmenities§!, urban services: without them city death rates rise as cities grow, in §Yevery pinned province§! (ours and our subjects'), with its costs and contributions.\n§gAlso pins this province.§!"
 mtui_bw_build_garrison_tt:0 "§YBuild Garrison§! (+1 level)\nOpens the construction dialog for §YGarrison§!, fortifications and garrisons: defence and local control, in §Yevery pinned province§! (ours and our subjects'), with its costs and contributions.\n§gAlso pins this province.§!"
 mtui_bw_build_pathing_tt:0 "§YBuild Pathing§! (+1 level)\nOpens the construction dialog for §YPathing§!, roads and bridges: communication efficiency and trade, in §Yevery pinned province§! (ours and our subjects'), with its costs and contributions.\n§gAlso pins this province.§!"
 mtui_bw_build_irrigation_tt:0 "§YBuild Irrigation§! (+1 level)\nOpens the construction dialog for §YIrrigation§!, water works: agricultural output, in §Yevery pinned province§! (ours and our subjects'), with its costs and contributions.\n§gAlso pins this province.§!"
 mtui_bw_build_harbourage_tt:0 "§YBuild Harbourage§! (+1 level)\nOpens the construction dialog for §YHarbourage§!, ports and docks: naval capacity and sea trade, in §Yevery pinned province§! (ours and our subjects'), with its costs and contributions.\n§gAlso pins this province.§!"
