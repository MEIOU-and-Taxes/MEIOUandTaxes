 # Revenue and expense tables (top bar, Nation Atlas Budget tab)
 mtui_tp_income_direct:0 "\n  Rents                                     £2px£§G[GV53_TaxD_Rents]§!¤\n  Land tax                                 £1px£§G[GV53_TaxD_Land]§!¤\n  Property tax                            £1px£§G[GV53_TaxD_PropertyBU]§!¤\n  Poll tax                                  £2px£§G[GV53_TaxD_Poll]§!¤\n  Chattel tax                              §G[GV53_TaxD_Chattel]§!¤\n  Inheritance tax                        £2px£§G[GV53_TaxD_Inheritance]§!¤\n  State property (net)                  §G[GV53_TaxD_BUProperty]§!¤"
 mtui_tp_income_indirect:0 "\n  Fees                                       §G[GV53_TaxD_Fees]§!¤\n  Tariffs                                    §G[GV53_Tariff_Income]§!¤\n  Excises (salt, substances)          £2px£§G[GV53_TaxD_ExciseBU]§!¤\n  Industry duties                        £2px£§G[GV53_TaxD_Industry]§!¤\n     §gof which tolls§!                       £1px£§G[GV53_TaxD_TollBU]§!¤\n     §gof which timber§!                    §G[GV53_TaxD_TimberBU]§!¤\n     §gof which alcohol§!                   §G[GV53_TaxD_AlcoholBU]§!¤\n  Obligations                             §G[GV53_TaxD_Obligations]§!¤\n  Other (commerce, tributes...)   £2px£§G[GV53_TopBar_OtherIndirect]§!¤"
 mtui_tp_income_special:0 "\n  Teutonic holdings                    §G[GV53_TaxD_Teuton]§!¤\n  Imperial taxes                         £2px£§G[GV53_TaxD_HRE]§!¤\n  Knight holdings                       §G[GV53_TaxD_Knights]§!¤\n  Trade posts                             §G[GV53_Post_Fees]§!¤"
 mtui_tp_income:0 "§YDirect taxation§!                          £1px£§G[GV53_TaxD_Direct]§!¤[mtui_tp_income_direct]\n\n§YIndirect taxation§!                        £1px£§G[GV53_TaxD_Indirect]§!¤[mtui_tp_income_indirect]\n\n§YSpecial income§!                          §G[GV53_TopBar_SpecialIncome]§!¤[mtui_tp_income_special]\n\n  Lost to tax farming                  £3px£§R[GV53_TaxD_Farming]§!¤\n  Lost to corruption                   £3px£§R[GV53_TaxD_Corruption]§!¤\n--------------------------------------\n§YRevenue§!                                   £2px£§G[GV53_TaxD_Total]§!¤"
 mtui_tp_expense:0 "§YExpenses§!                          £2px£§R[GV53_Realm_Expenses]§!¤\n\n  Officials' wages               £1px£§R[GV53_Admin_CostUni]§!¤\n  Military maintenance       §R[GV53_Mil_ManpowerExpenses]§!¤\n  Military recruitment        £1px£§R[GV53_BU_SpendMPBuild]§!¤\n  State property (net loss)   £2px£§R[GV53_TaxD_BUPropertyNeg]§!¤\n  Infrastructure                  §R[GV53_Infra_StateSpend]§!¤\n  Grain dole                     £3px£§R[GV53_Class_IncomeDole]§!¤\n  Colonial subsidies           £1px£§R[GV53_Colonial_SubsidyDisp]§!¤"
 # Estates: loyalty and power (top bar, Nation Atlas)
 mtui_tp_clan_power:0 "Clan power is almost entirely static and does not have any resting point. It is reduced by bureaucratic ideas, clan interactions and state edicts. \n\nClan power is exclusive with any other power in the province, which means that, for example, if clan power is 100%, no other estate is present, while 60% clan power will not allow any other estate power to grow beyond 40%. This includes state reach as well."
