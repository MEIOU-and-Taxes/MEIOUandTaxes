omads§!     £2px£[Disp_NMDmnd5]  [Disp_NMNeed5]\n    §T§fComfort§!§!      £2px£§GResidents§!    [Disp_REDmnd5]  [Disp_RENeed5]\n                      £2px£§TNobles§!       £1px£[Disp_NODmnd5]  [Disp_NONeed5]\n                      £2px£§TBurghers§!    £3px£[Disp_BGDmnd5]  [Disp_BGNeed5]\n                      £2px£§TClergy§!        [Disp_CLDmnd5]  [Disp_CLNeed5]\n                      £2px£§OTotal§!         £3px£§O[Disp_POP_Dmdn5]§! [Disp_POP_Need5]\n£mod_trade_consumer2£\n   £trade_consumer£           £2px£§lPeasantry§!    [Disp_SFDmnd21]  [Disp_SFNeed21]\n                      £2px£§lNomads§!     £2px£[Disp_NMDmnd21]  [Disp_NMNeed21]\n    §T§fComfort§!§!      £2px£§GResidents§!    [Disp_REDmnd21]  [Disp_RENeed21]\n                      £2px£§TNobles§!       £1px£[Disp_NODmnd21]  [Disp_NONeed21]\n                      £2px£§TBurghers§!    £3px£[Disp_BGDmnd21]  [Disp_BGNeed21]\n                      £2px£§TClergy§!        [Disp_CLDmnd21]  [Disp_CLNeed21]\n                      £2px£§OTotal§!         £3px£§O[Disp_POP_Dmdn21]§! [Disp_POP_Need21]\n\n[Disp_PageFooter]\nPopulation demand goods to fullfill their needs. §TNeeded§! is the minimum amount they require to reach 100% fullfilment, while §TDemand§! is what they can actually buy. §YClasses§! will prioritize §vLife§! fulfillment needs, and then evaluate based on their desires and budget what is better to spend their money on, considering costs of goods and what they get in return. If they are rich, they will buy more than needed to increase overall §YLife Quality.§!"
