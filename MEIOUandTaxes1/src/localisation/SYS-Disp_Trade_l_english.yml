§lNomads§!     £2px£[Disp_NMDmnd41]  [Disp_NMNeed41]\n    §uKnowledge§!   §GResidents§!    [Disp_REDmnd41]  [Disp_RENeed41]\n                      £2px£§TNobles§!       £1px£[Disp_NODmnd41]  [Disp_NONeed41]\n                      £2px£§TBurghers§!    £3px£[Disp_BGDmnd41]  [Disp_BGNeed41]\n                      £2px£§TClergy§!        [Disp_CLDmnd41]  [Disp_CLNeed41]\n                      £2px£§OTotal§!         £3px£§O[Disp_POP_Dmdn41]§! [Disp_POP_Need41]\n\n[Disp_PageFooter]\nPopulation demand goods to fullfill their needs. §TNeeded§! is the minimum amount they require to reach 100% fullfilment, while §TDemand§! is what they can actually buy. §YClasses§! will prioritize §vLife§! fulfillment needs, and then evaluate based on their desires and budget what is better to spend their money on, considering costs of goods and what they get in return. If they are rich, they will buy more than needed to increase overall §YLife Quality.§!"
 Disp_Trade4: "Price: How much a single unit of given tradegood is worth in ducats.\nStockpile: The amount of given tradegood that is stockpiled within a province. It is owned and maintained by merchants, with any cost or revenue going to commercial property owners.\nFulfillment: How much of province's demand for a given tradegood was met by supply and import. If related, lower value leads to reduction in class fulfillment, industry throughput, as well as increase in infrastructure decay.\nProduced: When displayed as X + Y, X is province's exportable production while Y is province's subsistence production.\nPurchased: How much of given tradegood was purchased by province's merchants into its stockpile.\nSold: How much of given tradegood was sold by province's merchants from its stockpile.\n\nTrade is about each provinces having supply and demand trying to resolve those two by getting the best deal possible. Supply comes from production, while demand comes from various sources such as population, construction, property and infrastructure maintenance, as well as industries. Provinces will buy from whoever offers the cheapest deal, while selling to whoever offers the highest price.\nA province can trade with another when there's a chain of merchants placed between the two. A tradenode where your capital is located at is considered as always having your merchant placed in it.\nEvery business transaction creates trade value, which can be collected normally for free money, while profit from buying low and selling high will go into your commerce industry.\n\n[Disp_PageFooter]\n"
 
 Trade_tooltip1: "Everyone wants §YFulfilment§! of their needs, and more: §TSupply§! and §TDemand§! decide who gets it.\n§YSubsistence§!: the part of production that never reaches the market. It lowers the exportable part of industrial output, and subsistence goods can only be sold within the same §OSector§!. It follows production vs commerce output."
 
 Trade_tooltip2_B: "\nThe §Yeconomy§! of the whole §OSector§!: population, buildings, infrastructure, industries (except commercial), army and navy.\n§GSubsistence§!: what the §Oindustries§! sold as subsistence. §GSold§!: what they sold to the §Ymerchants§! at the local price. §RPurchased§!: what the §OSector§! bought from the §Ymerchants' stockpile§!. Balance = §GSubsistence§! + §GSold§! - §RPurchased§!.\n§RWasted§!: goods the §Ymarket§! did not buy (the §Ymerchants§! had no capacity or no interest); they lose value.\nTip: no waste means the sector's industries sell §G100%§! of what they make, so investing in them pays."
 Trade_tooltip1_B: "§TLocal§!: §Tnet§! profit from selling vs buying locally. §GSold§! and §RPurchased§!: trade with other §OSectors§!. Intermediary: what this Sector earned when others traded through it.\nThe upper table shows the money traded §Onationally§! with other §Osectors§! (this one in §Tcyan§!), the lower one the trade with §Gforeign§! sectors, each split by trade §YNode§!.\nTip: the other sectors' tables show who this sector trades with: is it buying, selling, how much?"
 Trade_tooltip3: "\n\nThis simple layer displays imports/exports of goods in total §Tunits§! done with other sectors (not itself)."
 Trade_tooltip4: "\n\nThis simple layer displays current Stockpiles of the sector."
 
